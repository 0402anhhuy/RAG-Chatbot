# File: docker-compose.yml
services:
  spring-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-chatbot-spring
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/knowledge_hub
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      # Spring sends all RAG traffic to rag-service.
      RAG_SERVICE_URL: http://rag-service:8000
      RAG_SERVICE_API_KEY: ${RAG_SERVICE_API_KEY:-local-development-rag-service-key-32}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL: ${JWT_TTL:-PT1H}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_healthy

  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: rag-chatbot-rag-service
    environment:
      APP__ENV: development
      APP__HOST: 0.0.0.0
      SECURITY__ENABLED: "true"
      SECURITY__API_KEY: ${RAG_SERVICE_API_KEY:-local-development-rag-service-key-32}
      DATABASE__PATH: /app/data/app.db
      BM25__PERSIST_PATH: /app/data/bm25_index.jsonl
      INGEST__QUEUE_PATH: /app/data/ingest_queue.db
      UPLOAD__DIRECTORY: /app/data/uploads
      EMBEDDING__PROVIDER: dummy
      LLM__PROVIDER: mock
    ports:
      - "8001:8000"
    volumes:
      - rag_service_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/readiness', timeout=5); data = json.loads(r.read().decode()); raise SystemExit(0 if data.get('status') == 'ready' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Optional isolated instance of the same image over its own volume, useful for
  # a local trial without touching the main data volume.
  rag-shadow:
    profiles: ["shadow"]
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: rag-chatbot-rag-shadow
    environment:
      APP__ENV: development
      APP__HOST: 0.0.0.0
      SECURITY__ENABLED: "true"
      SECURITY__API_KEY: ${RAG_SERVICE_API_KEY:-local-development-rag-service-key-32}
      INGEST__WORKER_ENABLED: "true"
      DATABASE__PATH: /app/data/shadow/app.db
      BM25__PERSIST_PATH: /app/data/shadow/bm25_index.jsonl
      INGEST__QUEUE_PATH: /app/data/shadow/ingest_queue.db
      UPLOAD__DIRECTORY: /app/data/shadow/uploads
      EMBEDDING__PROVIDER: dummy
      LLM__PROVIDER: mock
    ports:
      - "8002:8000"
    volumes:
      - rag_service_shadow:/app/data/shadow
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/readiness', timeout=5); data = json.loads(r.read().decode()); raise SystemExit(0 if data.get('status') == 'ready' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: rag-chatbot-postgres
    environment:
      POSTGRES_DB: knowledge_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  rag_service_data:
  rag_service_shadow:
