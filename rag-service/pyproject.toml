[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-service"
version = "0.1.0"
description = "RAG service foundation and core platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "pypdf>=5,<7",
    "PyYAML>=6,<7",
    "redis>=5,<7",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
vector = [
    "faiss-cpu>=1.11,<2",
    "qdrant-client>=1.10,<2",
]
embeddings = [
    "sentence-transformers>=3.0,<5",
]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "config*"]

[tool.setuptools.package-data]
"app.core" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["app", "config"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiosqlite.*", "redis.*"]
ignore_missing_imports = true
