# CI builds and tests only the canonical `rag-service`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rag-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: rag-service/requirements.txt

      - name: Check required files
        run: |
          test -f requirements.txt
          test -f Dockerfile
          test -f eval/vi_golden.jsonl
          echo "rag-service manifests exist"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip check

      - name: Lint and type-check
        run: |
          python -m ruff check app config tests
          python -m mypy app config

      - name: Test
        run: python -m pytest

      - name: Retrieval eval gate (offline)
        run: |
          python -m app.eval.cli \
            --dataset eval/vi_golden.jsonl \
            --out eval-out \
            --min-recall 0.70 \
            --min-ndcg 0.40
