# CI builds and tests only the canonical `rag-service`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rag-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: rag-service/requirements.lock

      - name: Check required files
        run: |
          test -f requirements.lock
          test -f Dockerfile
          echo "rag-service manifests exist"

      - name: Install locked dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip check

      - name: Lint and type-check
        run: |
          python -m ruff check app config tests
          python -m mypy app config

      - name: Test
        run: python -m pytest
