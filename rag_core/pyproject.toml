[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot-core"
version = "0.1.0"
description = "Framework-independent RAG engine for the RAG Chatbot platform"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = [".."]
include = ["rag_core*"]
